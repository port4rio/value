name: Value Stocks Screening & AI Diagnosis

env:
  TZ: 'Asia/Tokyo' # 日本時間（JST）指定

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      with_ai:
        description: 'AI診断（Gemini）を実行する（未診断銘柄のみ）'
        type: boolean
        default: false
      force_ai:
        description: '【全銘柄強制再生成】既存の診断も含めて全銘柄を最新プロンプトで再生成する'
        type: boolean
        default: false
      force_increment:
        description: '【滞在日数強制加算】同日再実行時でも滞在日数を強制的に+1/-1する'
        type: boolean
        default: false

  # 定期自動実行（タイムゾーン: timezone: 'Asia/Tokyo'）
  schedule:
    # 平日(月〜金) 11:13 JST
    - cron: '13 11 * * 1-5'
      timezone: 'Asia/Tokyo'
    # 毎週土曜日 07:13 JST (金曜 22:13 UTC)
    - cron: '13 22 * * 5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Screening (and optional AI diagnosis)
        env:
          TZ: 'Asia/Tokyo'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SATURDAY_DIAGNOSIS: ${{ github.event_name == 'schedule' && github.event.schedule == '13 22 * * 5' }}
          WITH_AI: ${{ inputs.with_ai }}
          FORCE_AI: ${{ inputs.force_ai }}
          FORCE_INCREMENT: ${{ inputs.force_increment }}
        run: |
          ARGS=""
          if [ "$FORCE_AI" = "true" ]; then
            echo "🚀 Running screening with FORCED AI Diagnosis for ALL stocks..."
            ARGS="$ARGS --with-ai --force-ai"
          elif [ "$SATURDAY_DIAGNOSIS" = "true" ] || [ "$WITH_AI" = "true" ]; then
            echo "🚀 Running screening with AI Diagnosis..."
            ARGS="$ARGS --with-ai"
          fi
          if [ "$FORCE_INCREMENT" = "true" ]; then
            echo "⏳ Forcing stayDays increment (+1/-1)..."
            ARGS="$ARGS --force-increment"
          fi
          echo "🚀 Executing: npx tsx scripts/run_screening.ts $ARGS"
          npx tsx scripts/run_screening.ts $ARGS

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/stocks.json public/data/ai_diagnosis.json public/data/charts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update screening data" && git push)

      - name: Build static site with updated data
        run: npm run build:client

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
